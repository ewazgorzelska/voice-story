name: Pull Request

on:
  pull_request:
    branches:
      - master
      - dev

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  status-comment:
    name: Status Comment
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    if: always()
    permissions:
      pull-requests: write
    steps:
      - name: Download coverage reports
        uses: actions/download-artifact@v6
        with:
          name: coverage-report
          path: coverage/

      - name: Extract coverage summary
        id: coverage
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(cat coverage/coverage-summary.json | grep -o '"lines":{"total":[0-9]*,"covered":[0-9]*,"skipped":[0-9]*,"pct":[0-9.]*' | grep -o '"pct":[0-9.]*' | cut -d':' -f2)
            echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
          else
            echo "percentage=N/A" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR
        uses: actions/github-script@v8
        env:
          LINT_STATUS: ${{ needs.lint.result }}
          TEST_STATUS: ${{ needs.unit-tests.result }}
          COVERAGE: ${{ steps.coverage.outputs.percentage }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const lintStatus = process.env.LINT_STATUS;
            const testStatus = process.env.TEST_STATUS;
            const coverage = process.env.COVERAGE;
            
            const statusIcon = (status) => {
              switch(status) {
                case 'success': return '✅';
                case 'failure': return '❌';
                case 'cancelled': return '⚠️';
                case 'skipped': return '⏭️';
                default: return '❓';
              }
            };
            
            const overallSuccess = lintStatus === 'success' && testStatus === 'success';
            
            const comment = `## Pull Request Status Report
            
            ${overallSuccess ? '✅ **All checks passed!**' : '❌ **Some checks failed**'}
            
            ### Check Results
            
            | Check | Status |
            |-------|--------|
            | Lint | ${statusIcon(lintStatus)} ${lintStatus} |
            | Unit Tests | ${statusIcon(testStatus)} ${testStatus} |
            
            ### Coverage
            
            ${coverage !== 'N/A' ? `📊 Line Coverage: **${coverage}%**` : '⚠️ Coverage data not available'}
            
            ---
            *Generated by GitHub Actions*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

